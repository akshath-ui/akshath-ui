name: Refresh profile assets

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.github/scripts/generate_profile_assets.py'
      - '.github/workflows/profile-assets.yml'
  schedule:
    - cron: '0 6 * * *'

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate profile SVG assets
        run: python .github/scripts/generate_profile_assets.py

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "chore: refresh profile svg assets"
            git push
          fi
