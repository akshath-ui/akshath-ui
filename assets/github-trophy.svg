<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Trophies</title>
  <desc id="desc">A stylized trophy card for the GitHub profile README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="700" height="180" rx="22" fill="url(#bg)"/>
  <rect x="18" y="18" width="664" height="144" rx="18" fill="#0b1220" stroke="#1f2937"/>

  <g transform="translate(52,44)">
    <path d="M0 72 L24 72 L24 18 L0 18 L0 72 Z" fill="#e5e7eb" opacity="0.9"/>
    <path d="M38 72 L62 72 L62 18 L38 18 L38 72 Z" fill="#f3f4f6" opacity="0.9"/>
    <path d="M16 18 L48 18 L48 0 L16 0 Z" fill="url(#gold)"/>
    <path d="M8 18 L56 18 L62 72 L2 72 Z" fill="url(#gold)" opacity="0.92"/>
    <circle cx="32" cy="18" r="8" fill="#fef3c7"/>
    <path d="M8 72 H56 L50 96 H14 Z" fill="#cbd5e1"/>
    <path d="M8 96 H56 L62 112 H2 Z" fill="#94a3b8"/>
  </g>

  <g transform="translate(180,35)">
    <text x="0" y="28" fill="#f8fafc" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">GitHub Trophies</text>
    <text x="0" y="62" fill="#94a3b8" font-size="16" font-family="Segoe UI, Arial, sans-serif">Building momentum one commit at a time.</text>
    <g transform="translate(0,84)">
      <rect x="0" y="0" width="125" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
      <rect x="0" y="0" width="68" height="34" rx="17" fill="url(#cyan)"/>
      <text x="36" y="23" text-anchor="middle" fill="#082f49" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700">🏆</text>
      <text x="88" y="23" fill="#e2e8f0" font-size="14" font-family="Segoe UI, Arial, sans-serif">Top</text>
    </g>
    <g transform="translate(145,84)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
      <rect x="0" y="0" width="84" height="34" rx="17" fill="#34d399"/>
      <text x="42" y="23" text-anchor="middle" fill="#052e16" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700">⚡</text>
      <text x="103" y="23" fill="#e2e8f0" font-size="14" font-family="Segoe UI, Arial, sans-serif">Progress</text>
    </g>
  </g>
</svg>
